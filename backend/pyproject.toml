[project]
name = "lecture-studio"
version = "0.1.0"
description = "TUM Lecture Studio - local-first TUM-Live downloader and transcriber"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic>=2.7",
  "psutil>=5.9",
  "python-multipart>=0.0.9",
  "yt-dlp>=2025.1",
]

[project.optional-dependencies]
# NVIDIA CUDA / CPU inference via CTranslate2
whisper = ["faster-whisper>=1.1"]
# CUDA 12 runtime libraries for faster-whisper (Linux/Windows, NVIDIA only)
cuda = ["faster-whisper>=1.1", "nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
# Apple Silicon (Metal) inference via MLX - native macOS only
mlx = ["mlx-whisper>=0.4"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-psutil",
]

[project.scripts]
lecture-studio = "lecture_studio.main:run"
lecture-studio-stt = "lecture_studio.stt_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lecture_studio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs network / ffmpeg / models (deselect with -m 'not integration')"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "SIM105"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
